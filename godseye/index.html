  <!-- JARVIS vendored delta — uplink chrome & HUD return link (see JARVIS-INTEGRATION.md) -->
  <style>
    #jarvis-hud-return {
      display: inline-block;
      margin-top: 7px;
      font-size: 10px;
      letter-spacing: 0.16em;
      font-family: 'JetBrains Mono', monospace;
      color: #00e5ff;
      text-decoration: none;
      border: 1px solid rgba(0, 229, 255, 0.45);
      border-radius: 3px;
      padding: 3px 9px;
      background: rgba(2, 14, 20, 0.5);
      pointer-events: auto;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    #jarvis-hud-return:hover {
      background: rgba(0, 229, 255, 0.15);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }
    #jarvis-hud-return:focus-visible { outline: 1px solid #00e5ff; outline-offset: 2px; }
  </style>
  <script>
    // JARVIS vendored delta: learn the ORB HUD origin (passed by the opener via
    // #hud=, recovered from document.referrer, or persisted in localStorage) so
    // the return link works from LAN IPs and non-default ports too.
    (function () {
      var hud = null;
      var m = location.hash.match(/hud=([^&]+)/);
      if (m) { try { hud = decodeURIComponent(m[1]); } catch (e) {} }
      if (!hud && document.referrer) {
        try {
          var u = new URL(document.referrer);
          if (u.origin !== location.origin) hud = u.origin;
        } catch (e) {}
      }
      if (hud) { try { localStorage.setItem("jarvis_hud_origin", hud); } catch (e) {} }
      if (!hud) { try { hud = localStorage.getItem("jarvis_hud_origin"); } catch (e) {} }
      hud = hud || "http://localhost:5050";
      var a = document.getElementById("jarvis-hud-return");
      if (a) a.setAttribute("href", hud.replace(/\/$/, ""));
    })();
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
